spring.application.name=smart-bike-care
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smart_bike_care?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173
